[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-pipeline"
version = "0.1.0"
description = "Traceable ingestion and analysis of committed ChatGPT exports"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chatgpt-pipeline = "chatgpt_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatgpt_pipeline = ["web/*.html", "web/*.js", "web/*.css"]
